[package]
name = "alphadb-cli"
version = "1.0.0-dev.132"
edition = "2021"
authors = ["Wibo Kuipers <wkuipersoss@gmail.com>"]
description = "AlphaDB is a versatile tool for managing MySQL database versions, using JSON to define structures and simplify migrations across environments. "
license = "GPL-3.0"
license-file = "LICENSE"
homepage = "https://alphadb.w-kuipers.com"
repository = "https://github.com/w-kuipers/alphadb"   
readme = "README.md"

[features]
default = []

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
alphadb = { path = "../alphadb", features = ["mysql", "postgres", "version-source"] }
inquire = "0.9.4"
colored = "3.1.1"
toml = "1.1.8"
serde = "1.0.210"
serde_derive = "1.0.210"
home = "0.5.9"
aes-gcm = "0.11.1"
base64 = "0.23.1"
aead = "0.6.1"
aes = "0.9.3"
thiserror = "2.0.21"
serde_json = { version = "1.0.133", features = ["preserve_order"] }
ctrlc = "3.4.5"
openssl = { version = "0.10.68", features = ["vendored"] }
chrono = "0.4.41"
mysql = "25.0.1"
postgres = "0.19"
