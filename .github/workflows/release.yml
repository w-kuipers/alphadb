name: Release for production

on:
  push:
    tags: v1.0.0-beta.*

jobs:
  build-py:
    uses: ./.github/workflows/build-py.yml

  publish-py:
    name: Publish to PyPI
    strategy:
      matrix:
        # os: [macos-latest, windows-latest, ubuntu-22.04]
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        engine: [mysql, postgres]

    needs:
      - build-py
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/alphadb-mysql
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: python-api-${{ matrix.engine }}-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true

  publish-cargo:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build binaries
        run: |
          python scripts/build-scripts/cargo.py ${{ github.ref_name }}

      - name: Publish API to Cargo
        env:
          CARGO_AUTH_TOKEN: ${{ secrets.CARGO_AUTH_TOKEN }}
        run: |
          cd src/alphadb
          cargo login $CARGO_AUTH_TOKEN
          cargo publish --allow-dirty

      - name: Publish CLI to Cargo
        env:
          CARGO_AUTH_TOKEN: ${{ secrets.CARGO_AUTH_TOKEN }}
        run: |
          cd src/cli
          cargo login $CARGO_AUTH_TOKEN
          cargo publish --allow-dirty

  build-node:
    uses: ./.github/workflows/build-node.yml

  publish-node:
    name: Create NPM package
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        engine: [mysql, postgres]
    runs-on: ubuntu-latest

    needs:
      - build-node

    environment:
      name: release

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Build node package
        run: |
          npm install --global typescript
          python scripts/package-scripts/node.py ${{ github.ref_name }} ${{ matrix.engine }}

      - name: Publish to NPM
        run: |
          cd node-dist
          npm publish --access public --tag beta --provenance

  package-cli:
    name: Package CLI binaries
    if: startsWith(github.ref, 'refs/tags/')

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # os: [windows-latest]
        # os: [macos-latest, windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Build and package binaries
        run: |
          python scripts/build-scripts/cli.py ${{ github.ref_name }}

      - name: Store binary
        uses: actions/upload-artifact@v7
        with:
          name: cli-bin-${{ matrix.os }}
          path: ./dist/

  publish-github-release:
    needs:
      - build-node
      - package-cli
    uses: ./.github/workflows/publish-github-release.yml

  publish-distro-packages:
    name: Update Homebrew tap and AUR package
    needs:
      - publish-github-release
    runs-on: ubuntu-latest
    environment:
      name: release

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: cli-bin-*
          path: dist/
          merge-multiple: true

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: w-kuipers/homebrew-alphadb
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-alphadb

      - name: Clone AUR repository
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          git -c core.sshCommand="ssh -i ~/.ssh/aur" clone ssh://aur@aur.archlinux.org/alphadb-bin.git alphadb-aur

      - name: Update package files
        run: |
          python scripts/package-scripts/distro.py ${{ github.ref_name }} --dist dist --homebrew homebrew-alphadb --aur alphadb-aur

      - name: Push Homebrew tap
        run: |
          cd homebrew-alphadb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alphadb.rb
          git diff --cached --quiet && echo "Formula already up to date." && exit 0
          git commit -m "Bump to ${{ github.ref_name }}"
          git push

      - name: Push AUR package
        run: |
          cd alphadb-aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.sshCommand "ssh -i ~/.ssh/aur"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "PKGBUILD already up to date." && exit 0
          git commit -m "Bump to ${{ github.ref_name }}"
          git push
